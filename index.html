<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hey, you.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Nunito:wght@400;600&display=swap">
<style>
:root{--bg:#f5eee1;--bg2:#e9dfca;--ink:#3a3632;--brown:#8a6f5a;--sage:#a9b99f;--btn:#62785a;--btnt:#fbf7ee;--card:#fbf7ee;--heart:#c4806f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25231f;--bg2:#322e27;--ink:#efe7d8;--brown:#c4a58a;--sage:#7f9578;--btn:#a9bea0;--btnt:#25231f;--card:#34312b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#25231f;--bg2:#322e27;--ink:#efe7d8;--brown:#c4a58a;--sage:#7f9578;--btn:#a9bea0;--btnt:#25231f;--card:#34312b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;background:var(--sage);top:-20vmax;left:-20vmax;opacity:.35}
.b2{width:50vmax;height:50vmax;background:var(--bg2);bottom:-18vmax;right:-15vmax;animation-duration:24s}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--brown);opacity:.25;animation:rise 14s linear infinite}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.1)}}
@keyframes rise{from{transform:translateY(105vh)}to{transform:translateY(-10vh)}}
#app{position:relative;z-index:1;min-height:100%}
.stage{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 26px;text-align:center;max-width:520px;margin:0 auto}
.fade{animation:fin .7s ease both}
@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,.serif{font-family:"Fraunces",Georgia,serif;font-weight:400;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(44px,13vw,64px);line-height:1.05;cursor:default;user-select:none}
p{margin:0;font-size:18px;line-height:1.55;color:var(--brown);max-width:30ch}
.q{font-family:"Fraunces",Georgia,serif;font-size:26px;line-height:1.3;color:var(--ink);max-width:20ch}
.btn{font:600 16px "Nunito",system-ui,sans-serif;background:var(--btn);color:var(--btnt);border:0;border-radius:999px;padding:15px 30px;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .4s;min-height:48px}
.btn:active{transform:scale(.96)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--brown)}
.btn:focus-visible,.char:focus-visible,.sign:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
.row{display:flex;gap:14px;align-items:center;justify-content:center;min-height:70px}
.hid{opacity:0;pointer-events:none}
.char{cursor:pointer;display:inline-block;background:none;border:0;padding:0;line-height:0}
.char svg{display:block;width:140px;height:auto;overflow:visible}
.char.float{animation:bob 4.5s ease-in-out infinite}
.char.sm svg{width:76px}
@keyframes bob{50%{transform:translateY(-8px)}}
.boing svg{animation:boing .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes boing{30%{transform:scale(1.1,.9)}60%{transform:scale(.95,1.08) translateY(-6px)}}
.sign{background:var(--card);color:var(--ink);border-radius:16px;padding:16px 20px;font-family:"Fraunces",Georgia,serif;font-size:21px;line-height:1.3;max-width:15ch;cursor:pointer;border:2px solid var(--brown);position:relative;transition:transform .3s;user-select:none}
.sign::after{content:"";position:absolute;left:50%;bottom:-20px;width:3px;height:20px;background:var(--brown);transform:translateX(-50%)}
.sign.wob{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.hint{font-size:14px;color:var(--brown);opacity:.75}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--brown);opacity:.25;transition:.4s}
.dots i.on{opacity:1;background:var(--btn)}
.line{font-family:"Fraunces",Georgia,serif;font-size:clamp(28px,8vw,38px);line-height:1.25;max-width:16ch;min-height:5.2em;display:flex;align-items:center;opacity:0;transition:opacity 1s ease,transform 1s ease;transform:translateY(10px)}
.line.in{opacity:1;transform:none}
.big{font-family:"Fraunces",Georgia,serif;font-size:clamp(54px,17vw,84px);line-height:1;letter-spacing:-.03em}
.late{opacity:0;animation:fin 1.4s ease forwards}
.rv{display:none}.rv.on{display:flex;flex-direction:column;align-items:center;gap:18px;animation:fin 1s ease both}
.aside{display:inline-block;transform:rotate(-3deg);font-size:14px;color:var(--brown);font-style:italic}
.bar{width:180px;height:4px;border-radius:4px;background:rgba(138,111,90,.22);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--btn);border-radius:4px;animation:ld 3.4s ease-in-out forwards}
@keyframes ld{to{width:100%}}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.4s;z-index:9;max-width:86vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.fh{position:fixed;bottom:-30px;font-size:22px;color:var(--heart);opacity:0;animation:fh 7s ease-out forwards;pointer-events:none}
@keyframes fh{10%{opacity:.7}to{transform:translateY(-105vh);opacity:0}}
.roses{position:absolute;inset:0;overflow:hidden}
.rose{position:absolute;opacity:0;animation:rbloom 2.4s ease forwards}
.rose svg{display:block;width:100%;height:auto;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite alternate;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
@keyframes rbloom{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:.9;transform:none}}
@keyframes sway{from{transform:rotate(calc(var(--r) - 3deg))}to{transform:rotate(calc(var(--r) + 3deg))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div>
<i class="dot" style="left:12%;animation-delay:-3s"></i><i class="dot" style="left:38%;animation-delay:-9s;animation-duration:19s"></i><i class="dot" style="left:64%;animation-delay:-6s"></i><i class="dot" style="left:86%;animation-delay:-12s;animation-duration:22s"></i></div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), app=$("#app"), toastEl=$("#toast");
const pick=a=>a[Math.floor(Math.random()*a.length)], rnd=(a,b)=>Math.random()*(b-a)+a;
const HEART=(x,y,s)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 12C-20-2-14-14-5-12 -2-11 0-8 0-8S2-11 5-12C14-14 20-2 0 12Z" fill="#c4806f"/>`;
const peng=h=>`<svg viewBox="0 0 120 150" aria-label="penguin"><ellipse cx="60" cy="142" rx="30" ry="5" fill="#000" opacity=".08"/><ellipse cx="22" cy="92" rx="8" ry="22" fill="#4a453f" transform="rotate(12 22 92)"/><ellipse cx="98" cy="92" rx="8" ry="22" fill="#4a453f" transform="rotate(-12 98 92)"/><ellipse cx="60" cy="82" rx="38" ry="50" fill="#4a453f"/><ellipse cx="60" cy="94" rx="26" ry="36" fill="#f6efe3"/><circle cx="48" cy="55" r="4.5" fill="#fff"/><circle cx="72" cy="55" r="4.5" fill="#fff"/><circle cx="49" cy="56" r="2.2" fill="#222"/><circle cx="73" cy="56" r="2.2" fill="#222"/><path d="M52 63h16l-8 11z" fill="#d9a05b"/><circle cx="40" cy="66" r="5" fill="#e4a99a" opacity=".5"/><circle cx="80" cy="66" r="5" fill="#e4a99a" opacity=".5"/><ellipse cx="46" cy="138" rx="11" ry="5" fill="#d9a05b"/><ellipse cx="74" cy="138" rx="11" ry="5" fill="#d9a05b"/>${h?HEART(60,102,1.1):""}</svg>`;
const panda=()=>`<svg viewBox="0 0 120 140" aria-label="panda"><ellipse cx="60" cy="134" rx="32" ry="5" fill="#000" opacity=".08"/><ellipse cx="60" cy="108" rx="34" ry="28" fill="#fbf7ef" stroke="#d8ccb8" stroke-width="1.5"/><ellipse cx="30" cy="106" rx="9" ry="18" fill="#3a3632" transform="rotate(14 30 106)"/><ellipse cx="90" cy="106" rx="9" ry="18" fill="#3a3632" transform="rotate(-14 90 106)"/><circle cx="30" cy="30" r="14" fill="#3a3632"/><circle cx="90" cy="30" r="14" fill="#3a3632"/><circle cx="60" cy="62" r="37" fill="#fbf7ef" stroke="#d8ccb8" stroke-width="1.5"/><ellipse cx="45" cy="60" rx="8" ry="11" fill="#3a3632" transform="rotate(20 45 60)"/><ellipse cx="75" cy="60" rx="8" ry="11" fill="#3a3632" transform="rotate(-20 75 60)"/><circle cx="46" cy="59" r="3" fill="#fff"/><circle cx="74" cy="59" r="3" fill="#fff"/><ellipse cx="60" cy="73" rx="6" ry="4" fill="#3a3632"/><path d="M53 80q7 6 14 0" stroke="#3a3632" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="36" cy="76" r="5" fill="#e4a99a" opacity=".45"/><circle cx="84" cy="76" r="5" fill="#e4a99a" opacity=".45"/></svg>`;
const pig=()=>`<svg viewBox="0 0 120 140" aria-label="little pig"><ellipse cx="60" cy="134" rx="30" ry="5" fill="#000" opacity=".08"/><path d="M40 78h40l10 48H30z" fill="#b8584c"/><rect x="42" y="124" width="9" height="10" rx="3" fill="#e8b4a4"/><rect x="69" y="124" width="9" height="10" rx="3" fill="#e8b4a4"/><path d="M30 28l14 6-10 16zM90 28l-14 6 10 16z" fill="#dc9f8e"/><circle cx="60" cy="58" r="34" fill="#e8b4a4"/><ellipse cx="60" cy="68" rx="15" ry="11" fill="#dc9f8e"/><ellipse cx="54" cy="68" rx="2.4" ry="4" fill="#a8685a"/><ellipse cx="66" cy="68" rx="2.4" ry="4" fill="#a8685a"/><circle cx="46" cy="50" r="3.4" fill="#3a3632"/><circle cx="74" cy="50" r="3.4" fill="#3a3632"/><path d="M52 82q8 6 16 0" stroke="#a8685a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const ROSE=`<svg viewBox="0 0 100 140" aria-hidden="true"><path d="M50 66C48 92 52 116 49 138" stroke="#334030" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M50 104c-16-1-26-11-28-20 14-1 25 5 28 20z" fill="#334030"/><path d="M51 118c14 0 24-8 27-17-13-2-24 3-27 17z" fill="#3b4a37"/><path d="M20 40c-4-18 10-34 30-34s34 14 30 32c-3 16-16 28-30 28S23 56 20 40z" fill="#1a1617" stroke="#4d423e" stroke-width="1.4"/><path d="M30 34c2-12 12-20 22-20 12 0 20 8 18 20-2 10-12 18-22 16-8-2-12-8-10-14 2-5 8-7 13-5" fill="none" stroke="#6b5d57" stroke-width="1.5" stroke-linecap="round"/><path d="M24 44c8 12 22 16 34 12" fill="none" stroke="#51453f" stroke-width="1.3" stroke-linecap="round"/><path d="M76 30c-4-10-12-16-22-18" fill="none" stroke="#51453f" stroke-width="1.3" stroke-linecap="round"/></svg>`;
const addRoses=()=>{const bg=$(".bg");if(!bg||bg.querySelector(".roses"))return;const w=document.createElement("div");w.className="roses";[{l:"2%",b:"6%",w:84,r:-12,d:.6},{l:"78%",b:"10%",w:96,r:10,d:1},{l:"88%",b:"52%",w:70,r:14,d:1.4},{l:"-2%",b:"48%",w:78,r:-16,d:1.8},{l:"68%",b:"-4%",w:70,r:-6,d:2.2},{l:"18%",b:"-6%",w:64,r:8,d:2.6}].forEach(o=>{const e=document.createElement("div");e.className="rose";e.style.cssText=`left:${o.l};bottom:${o.b};width:${o.w}px;animation-delay:${o.d}s;--r:${o.r}deg`;e.innerHTML=ROSE;w.appendChild(e)});bg.appendChild(w)};
const ART={peng,panda,pig};
const char=(t,cls="",h)=>`<button class="char ${cls}" data-c="${t}" aria-label="${t}">${ART[t](h)}</button>`;
const MSG={peng:["Waddle waddle. Hi.","He’s been told you’re great. He agrees.","Flippers crossed this goes well.","Fun fact: penguins pick one favourite and stay."],
panda:["Panda fact: naps are a personality. Relatable.","Snack break? Always.","He’s been told you’re his favourite human.","Rolling over. That’s all he’s got."],
pig:["Oink. (Translation: hi.)","Muddy puddles are better with you.","Snort. That was a laugh.","She’s very into jumping. Just so you know."]};
let tt;const toast=t=>{toastEl.textContent=t;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),2600)};
const dodge=b=>{b.style.transform=`translate(${rnd(-60,60)}px,${rnd(-26,26)}px)`};
const reveal=id=>$(id).classList.remove("hid");
const next=()=>show(S.i+1);
const S={i:0};
const go=(id,fn)=>{$(id).onclick=fn};

const steps=[
// 0 intro
()=>({h:`${char("peng","float")}<h1 id="hey">Hey, you.</h1><p>There’s something I’ve been meaning to tell you.</p><button class="btn" id="go">Continue →</button>`,
init(){go("#go",next);let n=0;go("#hey",()=>{if(++n===5){toast("You found it. Secret prize: one free hug, redeemable in person.");n=0}})}}),
// 1 penguin sign
()=>({h:`<div class="sign" id="sg" role="button" tabindex="0"><span id="st">I like you a normal amount.</span></div>${char("peng","float")}<p class="hint" id="hn">(tap the sign)</p><div class="row"><button class="btn hid" id="nx">Fair enough →</button></div>`,
init(){go("#nx",next);const f=()=>{$("#st").textContent="Okay, that’s a lie.";$("#sg").classList.add("wob");$("#hn").textContent="";reveal("#nx")};go("#sg",f);$("#sg").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")f()}}}),
// 2 panda question
()=>({h:`${char("panda","float")}<div class="q" id="pq">Important question: do you like me more than sleep?</div><div class="row"><button class="btn" id="y">Yes</button><button class="btn alt" id="no">No</button></div><div class="row"><button class="btn hid" id="nx">Continue →</button></div>`,
init(){go("#nx",next);let n=0;const yes=()=>{$("#pq").textContent="Correct. It was close, though.";$("#y").classList.add("hid");$("#no").classList.add("hid");reveal("#nx")};go("#y",yes);
go("#no",()=>{if(n<2){n++;dodge($("#no"));toast(n===1?"Hm, that button’s shy.":"Wrong one. Try again.")}else if(n===2){n=3;$("#no").style.transform="";$("#no").textContent="Okay, yes"}else yes()})}}),
// 3 pig
()=>({h:`<div class="q" id="pt">Peppa Pig is sleeping. Wake her up?</div>${char("pig","float")}<div class="dots" id="pd"><i></i><i></i><i></i></div><p class="hint">(tap her a few times)</p><div class="row"><button class="btn hid" id="nx">Continue →</button></div>`,
init(){go("#nx",next);let n=0;const L=["zzz…","snort?","Oink! Good morning."];$(".char").addEventListener("click",()=>{if(n>=3)return;$("#pt").textContent=L[n];$("#pd").children[n].classList.add("on");n++;if(n===3)reveal("#nx")})}}),
// 4 dodge button
()=>({h:`<div style="display:flex;gap:6px;align-items:flex-end">${char("panda","sm")}${char("peng","sm")}${char("pig","sm")}</div><div class="q">Ready for the message?</div><div class="row"><button class="btn" id="rd">I’m ready</button></div>`,
init(){let n=0;go("#rd",()=>{if(n<2){n++;dodge($("#rd"));toast(n===1?"Too eager.":"Almost. Breathe.")}else next()})}}),
// 5 gradual reveal
()=>({h:`<div class="line" id="ln"></div><div class="dots" id="dd"><i></i><i></i><i></i><i></i></div><div class="row"><button class="btn alt" id="nx">Tap to continue</button></div>${char("panda","sm")}`,
init(){const L=["Somewhere between all our conversations…","You became my favourite person.","Talking to you is the best part of my day.","Thank you for putting up with my questionable sense of humour."];let k=0;
const set=()=>{const l=$("#ln");l.classList.remove("in");setTimeout(()=>{l.textContent=L[k];l.classList.add("in")},350);[...$("#dd").children].forEach((d,i)=>d.classList.toggle("on",i<=k))};
set();go("#nx",()=>{if(++k===L.length)next();else set()})}}),
// 6 finale
()=>({h:`<div class="q" style="font-size:32px">Okay, one last thing.</div><button class="btn" id="go">Go on →</button>`,
init(){go("#go",()=>{const st=["Decoding…","Reading between the lines…","Almost there…"];app.innerHTML=`<section class="stage fade"><div class="q" id="ds">Decoding…</div><div class="bar"><i></i></div></section>`;let j=0;const iv=setInterval(()=>{j=Math.min(j+1,2);const d=$("#ds");if(d)d.textContent=st[j]},1100);setTimeout(()=>{clearInterval(iv);rev()},3400)});const rev=()=>{app.innerHTML=`<section class="stage fade"><div class="big late" style="animation-delay:.4s">I love you.</div><div class="late" style="align-self:flex-end;animation-delay:1.4s"><span class="aside">(yeah, even more than Cristiano)</span></div><p class="rv" style="max-width:24ch">This was the only way I could have said it.</p><div class="rv">${char("peng","float",true)}</div><div class="rv"><p>Okay, that’s all. For now :)</p><button class="btn" id="fv">Forever? →</button></div><button class="btn alt late" id="tp" style="animation-delay:2.4s">Tap →</button></section>`;bind();addRoses();let r=0;const rvs=document.querySelectorAll(".rv");go("#tp",()=>{rvs[r].classList.add("on");r++;if(r===rvs.length)$("#tp").style.display="none"});
go("#fv",()=>{app.innerHTML=`<section class="stage fade">${char("panda","float")}<div class="q" style="font-size:30px">OK Jaanu. That’s what I was hoping for.</div>${char("peng","sm",true)}</section>`;bind();for(let i=0;i<14;i++){const h=document.createElement("span");h.className="fh";h.textContent="♥";h.style.left=rnd(5,95)+"vw";h.style.animationDelay=rnd(0,4)+"s";h.style.fontSize=rnd(14,26)+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),12000)}})}}})
];
function bind(){document.querySelectorAll("[data-c]").forEach(e=>e.addEventListener("click",()=>{e.classList.remove("boing");void e.offsetWidth;e.classList.add("boing");if(Math.random()<.55)toast(pick(MSG[e.dataset.c]))}))}
function show(i){S.i=i;const s=steps[i]();app.innerHTML=`<section class="stage fade">${s.h}</section>`;bind();s.init();window.scrollTo(0,0)}
show(0);
</script>
</body>
</html>
